  #hudToggle{width:auto;border:none;background:none;color:#7d8a99;font-size:13px;
    cursor:pointer;padding:2px 4px}
  #hud.collapsed #hudBody{display:none}
  #hud.collapsed{max-height:none}
  #hud .sub{color:var(--dim);font-size:11.5px;margin-bottom:10px}
  #hud label{display:block;margin:10px 0 3px;color:var(--dim);font-size:11px;
    text-transform:uppercase;letter-spacing:.06em}
  select,button,input[type=password],input[type=text]{width:100%;background:#141b24;color:var(--text);
    border:1px solid var(--panel-border);border-radius:5px;padding:5px 7px;font-size:12.5px}
  select:focus,input:focus{outline:1px solid var(--accent)}
  #attr{position:fixed;bottom:4px;right:8px;z-index:9;font-size:10.5px;color:#8b97a5;display:none}
  .camrow{display:flex;gap:6px;margin-top:4px}
  .camrow button{cursor:pointer;padding:5px 4px;font-size:11.5px}
  .camrow button:hover{border-color:var(--accent);color:#fff}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
  #dateLabel{font-size:11.5px;color:var(--text);text-align:center;margin-top:2px}
  #parkNote{font-size:11.5px;color:#ffb84d;margin-top:6px;min-height:16px}
  .tog{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer}
  .tog input{width:auto;accent-color:var(--accent)}
  #count{margin-top:10px;font-size:11.5px;color:var(--dim)}
  #legend{bottom:12px;left:12px;width:270px;padding:10px 14px}
  #legend .bar{height:10px;border-radius:3px;margin:6px 0 3px}
  #legend .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  #legend .ttl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  #detail{top:12px;right:12px;width:300px;display:none;max-height:calc(100% - 24px);overflow-y:auto}
  #detail h2{font-size:14px;margin:0 0 2px;color:#fff}
  #detail .des{font-size:12.5px;color:var(--text);margin:8px 0;padding:8px;background:#101720;
    border-radius:5px;border-left:3px solid var(--accent)}
  #detail table{width:100%;border-collapse:collapse;font-size:12px}
  #detail td{padding:2.5px 0;vertical-align:top}
  #detail td:first-child{color:var(--dim);width:44%}
  #detail .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--dim);
    background:none;border:none;width:auto;font-size:15px}
  #fatal{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,7,12,.96);
    color:#ff7b72;padding:40px;font:14px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}

</style>

  console.error(msg, err);
};

window.addEventListener('unhandledrejection', e => fatal('Unhandled rejection', e.reason));

// Procedural canvas textures — all detail generated, no external assets

function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...opts.repeat); }
  return t;
}

// ---------------------------------------------------------------------------
// Inferno colormap, clipped per CFG.rampClip
// ---------------------------------------------------------------------------
const INFERNO = [[0,0,4],[22,11,57],[66,10,104],[106,23,110],[147,38,103],
  [186,54,85],[221,81,58],[243,118,27],[252,165,10],[246,215,70],[252,255,164]];
function inferno01(t) {
  const [lo, hi] = CFG.rampClip;
  t = lo + (hi - lo) * Math.min(Math.max(t, 0), 1);
  const f = t * (INFERNO.length - 1), i = Math.min(Math.floor(f), INFERNO.length - 2), u = f - i;
  const c = INFERNO[i].map((v, k) => v + u * (INFERNO[i + 1][k] - v));
  return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
}

// ---------------------------------------------------------------------------
// Wall interpolation: Catmull-Rom over (angle, distance); linear for heights
// ---------------------------------------------------------------------------
function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
                (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
function segIndex(angDeg) {
  const A = CFG.wallAnglesDeg;
  const a = Math.min(Math.max(angDeg, A[0]), A[A.length - 1]);
  let i = 0;
  while (i < A.length - 2 && a > A[i + 1]) i++;
  return [i, (a - A[i]) / (A[i + 1] - A[i])];
}
function wallDistAt(park, angDeg) {
  const D = park.d, [i, t] = segIndex(angDeg);
  const p0 = D[Math.max(i - 1, 0)], p3 = D[Math.min(i + 2, D.length - 1)];
  return catmullRom(p0, D[i], D[i + 1], p3, t);
}
function wallHeightAt(park, angDeg) {
  const H = park.h, [i, t] = segIndex(angDeg);
  return H[i] + t * (H[i + 1] - H[i]);
}

// Does this trajectory clear `park`'s wall along its (fixed) spray azimuth?
function clearsWall(rec, park) {
  const phi = Math.min(Math.max(rec.spray_deg_field, -45), 45);
  const wd = wallDistAt(park, phi), wh = wallHeightAt(park, phi);
  const P = rec.points;
  for (let i = 1; i < P.length; i++) {
    const r0 = Math.hypot(P[i - 1][0], P[i - 1][1]);
    const r1 = Math.hypot(P[i][0], P[i][1]);
    if (r1 >= wd) {
      const u = (wd - r0) / Math.max(r1 - r0, 1e-9);
      const z = P[i - 1][2] + u * (P[i][2] - P[i - 1][2]);
      return z > wh;
    }
  }
  return false; // never reaches the wall -> stays in the yard
}

// ---------------------------------------------------------------------------
// Load data
// ---------------------------------------------------------------------------
async function loadData() {
  let resp;
  try { resp = await fetch(CFG.dataUrl + '?t=' + Date.now()); }   // bypass cache: nightly data refresh
  catch (err) { throw new Error(`Network error fetching ${CFG.dataUrl}: ${err.message}. Serve over HTTP, not file://`); }
  if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching ${CFG.dataUrl} — run pipeline.py first.`);
  let data;
  try { data = await resp.json(); }
  catch (err) { throw new Error(`${CFG.dataUrl} is not valid JSON: ${err.message}`); }
  if (!data.meta || !Array.isArray(data.trajectories) || data.trajectories.length === 0)
    throw new Error(`${CFG.dataUrl} malformed: expected {meta, trajectories[…]}`);
  for (const r of data.trajectories)
    if (!Array.isArray(r.points) || r.points.length < 2)
      throw new Error(`Trajectory record ${r.batter_name} ${r.game_date} has no usable points array.`);
  return data;
}

function startFreeRoam() {

function stopFreeRoam() {

});

let flyPrev = performance.now();
function flyUpdate() {
  const now = performance.now(), dt = Math.min((now - flyPrev) / 1000, 0.1);
  flyPrev = now;
  if (!fly.active) return;
  const k = fly.keys;
  const sp = fly.speed * ((k.ShiftLeft || k.ShiftRight) ? fly.fastMul : 1);
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
  const target = new THREE.Vector3();
  if (k.KeyW) target.add(fwd);
  if (k.KeyS) target.addScaledVector(fwd, -1);
  if (k.KeyD) target.add(right);
  if (k.KeyA) target.addScaledVector(right, -1);
  if (k.KeyE) target.y += 1;
  if (k.KeyQ) target.y -= 1;
  if (target.lengthSq() > 0) target.normalize().multiplyScalar(sp);
  fly.vel.lerp(target, 1 - Math.exp(-dt * 6));   // smooth accel/decel
  camera.position.addScaledVector(fly.vel, dt);
  camera.position.y = Math.max(camera.position.y, 3);
}

// outfield wall strip builder (Dodger wall + park overlays)
function buildWallStrip(park, {overlay = false} = {}) {
  const grp = new THREE.Group();
  const step = 1.5, pos = [], idx = [], angs = [];
  for (let a = -45; a < 45; a += step) angs.push(a);
  angs.push(45);
  for (let i = 0; i < angs.length; i++) {
    const rad = angs[i] * Math.PI / 180;
    const d = wallDistAt(park, angs[i]), h = wallHeightAt(park, angs[i]);
    const x = d * Math.cos(rad), y = d * Math.sin(rad);
    const b = toThree(x, y, 0), t = toThree(x, y, h);
    pos.push(b.x, b.y, b.z, t.x, t.y, t.z);
    if (i > 0) {
      const k = 2 * i;
      idx.push(k - 2, k - 1, k, k - 1, k + 1, k);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = overlay
    ? new THREE.MeshBasicMaterial({color: CFG.overlayColor, transparent: true,
        opacity: 0.18, side: THREE.DoubleSide, depthWrite: false})
    : new THREE.MeshLambertMaterial({color: CFG.wallColor, side: THREE.DoubleSide});
  grp.add(new THREE.Mesh(geo, mat));
  const top = [];
  for (let i = 0; i < angs.length; i++)
    top.push(new THREE.Vector3(pos[6 * i + 3], pos[6 * i + 4], pos[6 * i + 5]));
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(top),
    new THREE.LineBasicMaterial({color: overlay ? CFG.overlayColor : CFG.wallTopColor})));
  return grp;
}

function stripMesh(front, back, color, mat) {
  // front/back: equal-length Vector3 arrays forming a quad strip
  const n = front.length, pos = [], uv = [], idx = [];
  front.forEach((v, i) => { pos.push(v.x, v.y, v.z); uv.push(i / (n - 1), 0); });
  back.forEach((v, i) => { pos.push(v.x, v.y, v.z); uv.push(i / (n - 1), 1); });
  for (let i = 0; i < n - 1; i++) idx.push(i, i + n, i + 1, i + 1, i + n, i + n + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat || new THREE.MeshLambertMaterial({color, side: THREE.DoubleSide}));
}

function bowlR(t) {
  const s1 = Math.abs(Math.sin(deg(t + 45))), s2 = Math.abs(Math.sin(deg(t - 45)));
  return Math.max(55, Math.min(420, 25 / Math.max(s1, s2, 1e-4)));
}

    const r = bowlR(t), c = Math.cos(deg(t)), s = Math.sin(deg(t));
    st.push({px: r * c, py: r * s, nx: c, ny: s});
  }
  return st;
}

function hexFaceGeo(R) {
  const sh = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i;
    i ? sh.lineTo(R * Math.cos(a), R * Math.sin(a)) : sh.moveTo(R, 0);
  }
  sh.closePath();
  const g = new THREE.ShapeGeometry(sh);
  g.computeBoundingBox();
  const bb = g.boundingBox, uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++)
    uv.setXY(i, (uv.getX(i) - bb.min.x) / (bb.max.x - bb.min.x),
                (uv.getY(i) - bb.min.y) / (bb.max.y - bb.min.y));
  return g;
}

  if (!head.ok) { console.info(`No stadium GLB at ${mc.url} — procedural stadium in use.`); return; }
  let gltf;
  try {
    const {GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js');
    const {DRACOLoader} = await import('three/addons/loaders/DRACOLoader.js');
    const loader = new GLTFLoader();

let gTiles = null;
async function loadGoogleTiles(key) {
  const gc = CFG.googleTiles, status = document.getElementById('gKeyStatus');
  status.textContent = 'Loading 3D tiles…';
  try {
    const [{TilesRenderer, WGS84_ELLIPSOID}, plugins] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.0/build/index.three.js'),
      import('https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.0/build/index.plugins.js'),
    ]);
    const {GoogleCloudAuthPlugin, CesiumIonAuthPlugin} = plugins;
    if (gTiles) { scene.remove(gTiles.wrapper); gTiles.dispose(); gTiles = null; }
    const tiles = new TilesRenderer();
    // Cesium ion tokens are JWTs ("eyJ…"), Google Maps keys start with "AIza"
    if (key.startsWith('eyJ')) {
      tiles.registerPlugin(new CesiumIonAuthPlugin({
        apiToken: key, assetId: gc.ionAssetId, autoRefreshToken: true}));
    } else {
      tiles.registerPlugin(new GoogleCloudAuthPlugin({apiToken: key, autoRefreshToken: true}));
    }
    tiles.setCamera(camera);
    tiles.setResolutionFromRenderer(camera, renderer);
    tiles.errorTarget = gc.errorTarget;
    // Place home plate's ENU frame at the scene origin (east->x, north->y, up->z),
    // then rotate Z-up to Y-up and yaw so +x faces center field.
    const D2R = Math.PI / 180;
    const enu = new THREE.Matrix4();
    WGS84_ELLIPSOID.getEastNorthUpFrame(gc.latDeg * D2R, gc.lonDeg * D2R, 0, enu);
    tiles.group.matrix.copy(enu).invert();
    tiles.group.matrix.decompose(tiles.group.position, tiles.group.quaternion, tiles.group.scale);
    const zfix = new THREE.Group();
    zfix.rotation.x = -Math.PI / 2;
    zfix.add(tiles.group);
    const wrapper = new THREE.Group();
    wrapper.add(zfix);
    wrapper.scale.setScalar(FT_PER_M_VIEW);
    wrapper.rotation.y = deg(gc.yawDeg);
    wrapper.position.set(...gc.worldOffsetFt);
    scene.add(wrapper);
    tiles.wrapper = wrapper;

    // auto-level: drop the streamed ground to y=0 at home plate. Re-corrects as
    // finer LOD streams in; ignores absurd hits against coarse whole-earth tiles.
    let levelPasses = 0;
    const levelRay = new THREE.Raycaster(
      new THREE.Vector3(0, 20000, 0), new THREE.Vector3(0, -1, 0));
    const relevel = () => {
      if (levelPasses >= 3) return;      // settle, don't chase LOD jitter forever
      scene.updateMatrixWorld(true);
      const probe = (x, z) => {
        levelRay.ray.origin.set(x, 20000, z);
        const h = levelRay.intersectObject(tiles.group, true);
        return h.length ? h[0].point.y : null;
      };
      // two probes (plate + CF grass) must agree — rejects coarse-LOD garbage
      const a = probe(0, 0), b = probe(0, -300);
      if (a === null || b === null || Math.abs(a - b) > 30) return;
      const dy = (a + b) / 2;
      if (Math.abs(dy) < 4) { levelPasses = 3; return; }   // close enough — lock in
      const target = wrapper.position.y - dy;
      if (target < -600 || target > -100) return;  // implausible for LA terrain
      wrapper.position.y = target;
      levelPasses++;
      console.info(`Tiles level pass ${levelPasses}: corrected ${dy.toFixed(1)} ft`);
    };
    const settleTimer = setInterval(() => {
      relevel();
      if (levelPasses >= 3) scanStretch(tiles, wrapper);   // only after ground settles
      if (scanStretched && levelPasses >= 3) clearInterval(settleTimer);
    }, 5000);

    tiles.addEventListener('load-root-tileset', () => {
      stadium.visible = false;
      scene.fog.density = gc.fogDensity;
      camera.far = 40000; camera.updateProjectionMatrix();
      document.getElementById('attr').style.display = 'block';
      // real stands occupy the procedural presets' spots — hover the field instead
      CAMS.home = {pos: [0, 130, 140], tgt: [0, 40, -250]};
      CAMS.cf = {pos: [0, 150, -600], tgt: [0, 30, 0]};
      setCam('home');
      status.textContent = 'Photorealistic tiles active. Tune via window.__gTiles.wrapper.';
    });
    tiles.addEventListener('load-model', ({scene: tileScene}) => {
      tileScene.traverse(o => {
        if (o.isMesh && o.material && o.material.color) o.material.color.setScalar(gc.dim);
      });
    });
    tiles.addEventListener('load-error', e => {
      status.textContent = 'Tile load error — check key + Map Tiles API enablement. Procedural stadium kept.';
      console.error('3D tiles load error', e);
    });
    gTiles = tiles;
    window.__gTiles = tiles;
  } catch (err) {
    status.textContent = `3D tiles failed: ${err.message || err}`;
    console.error(err);
  }
}

// Explicit foul poles at the true +-45 deg, 330 ft corners. The photogrammetry
// never reconstructs the thin real poles, which makes near-line arcs read foul
// against the wrong landmarks (scoreboard pylons). Always visible.
const foulPoles = {};
function placeFoulPole(side, azDeg, r) {

  const dx = r * Math.cos(rad), dy = r * Math.sin(rad);
  side.pole.position.copy(toThree(dx, dy, 34));
  side.fin.position.copy(toThree(dx, dy, 50));
  side.fin.lookAt(new THREE.Vector3(0, 50, 0));
}

// Scan-calibrated wall pass: raycast the streamed photogrammetry to find the
// real barrier (wall/stands front) per azimuth, then stretch any arc that
// lands short of it so every HR visibly leaves the yard it really left.
let scanStretched = false;
function scanStretch(tiles, wrapper) {
  if (scanStretched || tubes.length === 0) return;
  scene.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const surfY = (wx, wz) => {
    ray.set(new THREE.Vector3(wx, 3000, wz), down);
    const h = ray.intersectObject(tiles.group, true);
    return h.length ? h[0].point.y : null;
  };
  const samples = {};
  let n = 0;
  for (let az = -44; az <= 44; az += 2) {
    const rad = deg(az);
    for (let r = 250; r <= 470; r += 6) {
      const y = surfY(r * Math.sin(rad), -r * Math.cos(rad));
      if (y !== null && y > 6) { samples[az] = Math.min(r, 420); n++; break; }
    }
  }
  if (n < 30) return;   // LOD not ready near the wall yet; retry on next event
  scanStretched = true;
  const barrierAt = az => {
    const lo = Math.floor(az / 2) * 2, hi = lo + 2;
    const a = samples[lo], b = samples[hi];
    if (a !== undefined && b !== undefined) return a + (b - a) * (az - lo) / 2;
    return (a ?? b ?? wallDistAt(PARKS.LAD, az) + 18);
  };
  let fixed = 0;
  for (const mesh of tubes) {
    const rec = mesh.userData.rec;
    const az = Math.min(Math.max(rec.spray_deg_field, -44), 44);
    const target = barrierAt(az) + 6;
    const last = rec.points[rec.points.length - 1];
    const landR = Math.hypot(last[0], last[1]);
    if (landR >= target) continue;
    const k = target / Math.max(landR, 1);
    if (k > 1.6) continue;
    rec.points = rec.points.map(([x, y, z]) => [x * k, y * k, z]);
    const vecs = rec.points.map(p => toThree(p[0], p[1], Math.max(p[2], 0)));
    mesh.geometry.dispose();
    mesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(vecs),
      Math.min(vecs.length * 2, 200), CFG.tubeRadiusFt, 6, false);
    fixed++;
  }
  clearsCache.clear();
  console.info(`Scan wall pass: ${fixed} arcs stretched past the real (scanned) fence.`);

  // snap the marker poles onto the scan's actual poles (survives transform tweaks)
  const poleSweep = (a0, a1) => {
    for (let az = a0; az <= a1; az += 0.1) {
      const rad = deg(az);
      ray.set(new THREE.Vector3(0, 40, 0),
        new THREE.Vector3(Math.sin(rad), 0, -Math.cos(rad)));
      ray.far = 500;
      const h = ray.intersectObject(tiles.group, true);
      if (h.length && h[0].distance > 280 && h[0].distance < 365)
        return {az, r: h[0].distance};
    }
    return null;
  };
  const pR = poleSweep(38, 50), pL = poleSweep(-50, -38);
  if (pR && pL) {
    placeFoulPole(foulPoles.R, pR.az, pR.r);
    placeFoulPole(foulPoles.L, pL.az, pL.r);
    console.info(`Foul poles snapped to scan: L ${pL.az.toFixed(1)}deg/${pL.r.toFixed(0)}ft, ` +
                 `R ${pR.az.toFixed(1)}deg/${pR.r.toFixed(0)}ft`);
  }
}

// Trajectory tubes

const evs = recs.map(r => r.launch_speed);
const evMin = Math.min(...evs), evMax = Math.max(...evs);
document.getElementById('evMin').textContent = evMin.toFixed(1);
document.getElementById('evMax').textContent = evMax.toFixed(1);
{

const trajGroup = new THREE.Group();
scene.add(trajGroup);
const tubes = [];
// Statcast hit coordinates are noisy; a handful of HRs compute a spray angle a
// degree or two past the foul line. Every HR was fair — nudge those azimuths
// back inside the lines (rotation only; distance and shape untouched).
let foulNudged = 0;
for (const rec of recs) {
  const sa = rec.spray_deg_field;
  if (Math.abs(sa) > 42) {
    const th = (Math.sign(sa) * 42 - sa) * Math.PI / 180;
    const c = Math.cos(th), s = Math.sin(th);
    rec.points = rec.points.map(([x, y, z]) => [x * c - y * s, x * s + y * c, z]);
    rec.spray_deg_field = Math.sign(sa) * 42;
    foulNudged++;
  }
}
if (foulNudged) console.info(`${foulNudged} HRs nudged inside the foul lines (hc noise past ±42°).`);

// Every one of these balls cleared the Dodger Stadium fence in reality. Where
// the reconstruction falls short of the wall, stretch its horizontal reach
// minimally (shape and height untouched) so it lands beyond the fence.
let wallStretched = 0;
for (const rec of recs) {
  const phi = Math.min(Math.max(rec.spray_deg_field, -44), 44);
  const wd = wallDistAt(PARKS.LAD, phi), wh = wallHeightAt(PARKS.LAD, phi);
  const last = rec.points[rec.points.length - 1];
  const landR = Math.hypot(last[0], last[1]);
  const clears = clearsWall(rec, PARKS.LAD);
  if (!clears || landR < wd + 4) {
    const k = (wd + 12) / Math.max(landR, 1);
    if (k > 1 && k < 1.35) {
      rec.points = rec.points.map(([x, y, z]) => [x * k, y * k, z]);
      wallStretched++;
    }
  }
}
if (wallStretched) console.info(`${wallStretched} HRs stretched past the fence (reconstruction fell short of the wall).`);
for (const rec of recs) {
  const vecs = rec.points.map(p => toThree(p[0], p[1], Math.max(p[2], 0)));
  const curve = new THREE.CatmullRomCurve3(vecs);
  const geo = new THREE.TubeGeometry(curve, Math.min(vecs.length * 2, 200), CFG.tubeRadiusFt, 6, false);
  const t = evMax > evMin ? (rec.launch_speed - evMin) / (evMax - evMin) : 0.5;
  const color = inferno01(t);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color}));
  mesh.userData = {rec, baseColor: color.clone(), dimmed: false};
  mesh.layers.enable(CFG.bloomLayer);
  trajGroup.add(mesh);
  tubes.push(mesh);
}
console.log(`Rendered ${tubes.length} trajectories; season HR total ${meta.season_hr_total}; ` +
  `pipeline dropped ${meta.dropped_missing_data}.`);

// ---------------------------------------------------------------------------
// Selective bloom (tubes only): classic darken-non-bloomed two-pass composite
// ---------------------------------------------------------------------------
const bloomLayerTest = new THREE.Layers();
bloomLayerTest.set(CFG.bloomLayer);
const darkMat = new THREE.MeshBasicMaterial({color: 0x000000});
const matCache = new Map();

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  CFG.bloom.strength, CFG.bloom.radius, CFG.bloom.threshold);
bloomComposer.addPass(bloomPass);

const mixPass = new ShaderPass(new THREE.ShaderMaterial({
  uniforms: {
    baseTexture: {value: null},
    bloomTexture: {value: bloomComposer.renderTarget2.texture},
  },
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D baseTexture; uniform sampler2D bloomTexture; varying vec2 vUv;
    void main(){ gl_FragColor = texture2D(baseTexture, vUv) + vec4(1.0) * texture2D(bloomTexture, vUv); }`,
}), 'baseTexture');
mixPass.needsSwap = true;

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(new RenderPass(scene, camera));
finalComposer.addPass(mixPass);
finalComposer.addPass(new OutputPass());

function darkenNonBloomed(obj) {
  if ((obj.isMesh || obj.isLine) && !bloomLayerTest.test(obj.layers)) {
    matCache.set(obj, obj.material);
    obj.material = darkMat;
  }
}
function restoreMaterials(obj) {
  if (matCache.has(obj)) {
    obj.material = matCache.get(obj);
    matCache.delete(obj);
  }
}

// ---------------------------------------------------------------------------
// Filters
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const dates = [...new Set(recs.map(r => r.game_date))].sort();
const state = {lo: 0, hi: dates.length - 1, batter: '', pitcher: '', pitch: '',
  park: '', dimStayed: true, selected: null, homeOnly: false};

// date dropdown: full season, recency windows, calendar months
{
  const sel = $('fDate');
  const MN = {'03': 'March', '04': 'April', '05': 'May', '06': 'June',
              '07': 'July', '08': 'August', '09': 'September', '10': 'October'};
  for (const [v, t] of [['last:7', 'Last 7 days'], ['last:14', 'Last 14 days'],
                        ['last:30', 'Last 30 days']]) {
    const o = document.createElement('option');
    o.value = v; o.textContent = t; sel.appendChild(o);
  }
  for (const m of [...new Set(dates.map(d => d.slice(0, 7)))]) {
    const o = document.createElement('option');
    o.value = 'm:' + m; o.textContent = MN[m.slice(5)] || m; sel.appendChild(o);
  }
  sel.addEventListener('change', e => {
    const v = e.target.value;
    let lo = 0, hi = dates.length - 1;
    if (v.startsWith('last:')) {
      const cut = new Date(dates[hi] + 'T12:00:00');
      cut.setDate(cut.getDate() - +v.slice(5));
      const cutS = cut.toISOString().slice(0, 10);
      const i = dates.findIndex(d => d >= cutS);
      lo = i < 0 ? hi : i;
    } else if (v.startsWith('m:')) {
      const m = v.slice(2);
      const first = dates.findIndex(d => d.startsWith(m));
      if (first >= 0) {
        lo = first;
        hi = dates.length - 1 - [...dates].reverse().findIndex(d => d.startsWith(m));
      }
    }
    state.lo = lo; state.hi = hi;
    applyFilters();
  });
}

function fillSelect(el, values) {
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v[0]; o.textContent = v[1];
    el.appendChild(o);
  }
}
const countBy = (arr, key) => {
  const m = new Map();
  for (const r of arr) { const k = key(r); if (k) m.set(k, (m.get(k) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
};
fillSelect($('fBatter'), countBy(recs, r => r.batter_name).map(([k, n]) => [k, `${k} (${n})`]));
fillSelect($('fPitcher'), countBy(recs, r => r.pitcher_name).map(([k, n]) => [k, `${k} (${n})`]));
fillSelect($('fPitch'), countBy(recs, r => r.pitch_type).map(([k, n]) =>
  [k, `${PITCH_NAMES[k] || k} (${n})`]));
fillSelect($('fPark'), Object.entries(PARKS).filter(([k]) => k !== 'LAD')
  .sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, p]) => [k, p.name]));

const clearsCache = new Map();  // parkKey -> Map(rec -> bool)
function clearsAt(rec, parkKey) {
  if (!clearsCache.has(parkKey)) clearsCache.set(parkKey, new Map());
  const m = clearsCache.get(parkKey);
  if (!m.has(rec)) m.set(rec, clearsWall(rec, PARKS[parkKey]));
  return m.get(rec);
}

function applyFilters() {
  const dLo = dates[state.lo], dHi = dates[state.hi];
  $('dateLabel').textContent = `${dLo} → ${dHi}`;
  let visible = 0, stayed = 0, visibleTotal = 0;
  for (const mesh of tubes) {
    const r = mesh.userData.rec;
    const pass = r.game_date >= dLo && r.game_date <= dHi &&
      (!state.homeOnly || r.home_team === 'LAD') &&
      (!state.batter || r.batter_name === state.batter) &&
      (!state.pitcher || r.pitcher_name === state.pitcher) &&
      (!state.pitch || r.pitch_type === state.pitch);
    mesh.visible = pass;
    if (!pass) continue;
    visibleTotal++;
    let dim = false;
    if (state.park && state.dimStayed && !clearsAt(r, state.park)) { dim = true; stayed++; }
    mesh.userData.dimmed = dim;
    const mat = mesh.material;
    const setGhost = g => {
      if (mat.transparent !== g) { mat.transparent = g; mat.needsUpdate = true; }
      mat.opacity = g ? 0.12 : 1;
      mat.depthWrite = !g;
    };
    if (state.selected) {
      // focus mode: chosen arc glows, everything else fades to ghosts
      if (mesh === state.selected) {
        mat.color.set(0xffffff);
        setGhost(false);
        mesh.layers.enable(CFG.bloomLayer);
      } else {
        mat.color.set(0x49525e);
        setGhost(true);
        mesh.layers.disable(CFG.bloomLayer);
      }
    } else if (dim) {
      mat.color.set(CFG.dimColor);
      setGhost(false);
      mesh.layers.disable(CFG.bloomLayer);
    } else {
      mat.color.copy(mesh.userData.baseColor);
      setGhost(false);
      mesh.layers.enable(CFG.bloomLayer);
      visible++;
    }
  }
  $('count').textContent = `${visibleTotal} of ${tubes.length} HRs shown`;
  $('parkNote').textContent = state.park
    ? `${stayed} of ${visibleTotal} shown would have stayed in the yard at ${PARKS[state.park].name}`
    : '';
}

$('fBatter').addEventListener('change', e => { state.batter = e.target.value; applyFilters(); });
$('fPitcher').addEventListener('change', e => { state.pitcher = e.target.value; applyFilters(); });
$('fPitch').addEventListener('change', e => { state.pitch = e.target.value; applyFilters(); });
$('fPark').addEventListener('change', e => {
  state.park = e.target.value;
  overlayGroup.clear();
  if (state.park) overlayGroup.add(buildWallStrip(PARKS[state.park], {overlay: true}));
  applyFilters();
});
$('parkToggle').addEventListener('change', e => { state.dimStayed = e.target.checked; applyFilters(); });
$('fHome').addEventListener('change', e => { state.homeOnly = e.target.checked; applyFilters(); });
$('hudHeader').addEventListener('click', () => {
  const hud = $('hud');
  hud.classList.toggle('collapsed');
  $('hudToggle').textContent = hud.classList.contains('collapsed') ? '▸' : '▾';
});
$('camHome').addEventListener('click', () => setCam('home'));
$('camCF').addEventListener('click', () => setCam('cf'));
$('camTop').addEventListener('click', () => setCam('top'));
$('camFly').addEventListener('click', () => fly.active ? stopFreeRoam() : startFreeRoam());

// ---------------------------------------------------------------------------
// Picking + detail panel
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
raycaster.params.Mesh = {};
const pointer = new THREE.Vector2();
let downXY = null;


function showDetail(rec) {
  $('dTitle').textContent = rec.batter_name;
  $('dSub').textContent = `${rec.game_date} · ${rec.away_team} @ ${rec.home_team}`;
  $('dDes').textContent = rec.des || '(no description)';
  const pl = $('dPlayer'), vid = $('dVideo');
  if (rec.video_mp4) {
    pl.src = rec.video_mp4;
    pl.style.display = 'block';
  } else {
    pl.pause(); pl.removeAttribute('src'); pl.style.display = 'none';
  }
  if (rec.video_url) {
    vid.href = rec.video_url;
    vid.style.display = 'block';
    vid.textContent = rec.video_mp4 ? '↗ Open on Baseball Savant' : '▶ Watch this home run';
  } else vid.style.display = 'none';
  const rows = [
    ['Pitcher', rec.pitcher_name],
    ['Pitch', rec.pitch_type ? `${PITCH_NAMES[rec.pitch_type] || rec.pitch_type} (${rec.release_speed ?? '?'} mph)` : '—'],
    ['Exit velocity', `${rec.launch_speed.toFixed(1)} mph`],
    ['Launch angle', `${rec.launch_angle.toFixed(1)}°`],
    ['Spray angle', `${rec.spray_deg_field.toFixed(1)}° (${rec.spray_deg_field < 0 ? 'LF' : 'RF'} side)`],
    ['Statcast distance', `${rec.hit_distance_sc.toFixed(0)} ft`],
    ['Simulated distance', `${rec.sim_distance_ft.toFixed(0)} ft`],
    ['Apex', `${rec.apex_ft.toFixed(0)} ft`],
    ['Hang time', `${rec.hang_time_s.toFixed(2)} s`],
    ['Bats', rec.stand],
    ['MLBAM batter / pitcher', `${rec.batter} / ${rec.pitcher}`],
  ];
  $('dTable').innerHTML = rows.map(([k, v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  $('detail').style.display = 'block';
}
$('detailClose').addEventListener('click', () => {
  $('detail').style.display = 'none';
  state.selected = null;
  const pl = $('dPlayer'); pl.pause(); pl.removeAttribute('src'); pl.load();
  applyFilters();
});

renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 5) return;   // drag, not click
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(tubes.filter(t => t.visible), false);
  if (hits.length) {
    state.selected = hits[0].object;
    showDetail(state.selected.userData.rec);
  } else {
    state.selected = null;
    $('detail').style.display = 'none';
    const pl = $('dPlayer'); pl.pause(); pl.removeAttribute('src'); pl.load();
  }
  applyFilters();
});

// ---------------------------------------------------------------------------
// Render loop + resize
// ---------------------------------------------------------------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  bloomComposer.setSize(innerWidth, innerHeight);
  finalComposer.setSize(innerWidth, innerHeight);
});

const bgBlack = new THREE.Color(0x000000);
const bgScene = scene.background.clone();
function animate() {
  requestAnimationFrame(animate);
  flyUpdate();
  if (!fly.active) controls.update();
  if (gTiles) gTiles.update();
  scene.traverse(darkenNonBloomed);
  scene.background = bgBlack;
  bloomComposer.render();
  scene.traverse(restoreMaterials);
  scene.background = bgScene;
  finalComposer.render();
}
applyFilters();
animate();
window.__viewer = {camera, controls, setCam};   // debug/inspection handle

// nightly data watcher: when the pipeline writes fresh trajectories, reload
setInterval(async () => {
  try {
    const r = await fetch(CFG.dataUrl + '?t=' + Date.now());
    if (!r.ok) return;
    const d = await r.json();
    if (d.meta && d.meta.pulled_range[1] !== meta.pulled_range[1]) location.reload();
  } catch {}
}, 30 * 60 * 1000);
</script>
