name: Nightly Statcast refresh

on:
  schedule:
    - cron: '30 11 * * *'      # 11:30 UTC = 4:30am Pacific, after all games final
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # persist the Statcast parquet + clip-url caches so each run only
      # fetches what is genuinely new
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}
          restore-keys: statcast-raw-

      - name: Install dependencies
        run: pip install --quiet pybaseball pandas numpy pyarrow

      - name: Refresh current season
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python pipeline.py --year "$(date -u +%Y)" --refresh-videos
          else
            python pipeline.py --year "$(date -u +%Y)"
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trajectories_*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: nightly Statcast refresh $(date -u +%F)"
            git push
          fi
